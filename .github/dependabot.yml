version: 2

updates:
  # Projects, Directory.Packages.props and the tools in .config/dotnet-tools.json (Dependabot only looks for the tool
  # manifest there, not in the repository root).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it (security updates are not delayed).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # The upgrade gate deliberately pins the Velopack library that Hash Tool 1.1.x shipped.
    exclude-paths:
      - "tests/Compat/**"
    groups:
      avalonia:
        patterns: ["Avalonia*", "Material.Icons*"]
      microsoft:
        patterns: ["Microsoft.Extensions.*", "System.*"]
      tests:
        patterns: ["xunit*", "Microsoft.Testing.*", "BenchmarkDotNet*", "dotnet-coverage", "FsCheck*"]
      # vpk packs the releases that the Velopack library in the app installs: keep both on the same version.
      velopack:
        patterns: ["Velopack", "vpk"]
    ignore:
      # xunit.v3 4.x breaks Avalonia.Headless.XUnit (AvaloniaUI/Avalonia#22072).
      - dependency-name: "xunit.v3*"
        update-types: ["version-update:semver-major"]
      # These follow the .NET major version the app targets (.NET 10 LTS); move them together with the SDK.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.IO.Hashing"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.CommandLine"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it (security updates are not delayed).
    cooldown:
      default-days: 7
    ignore:
      # Stay on .NET 10 (LTS) until the move to a new major version is made on purpose.
      - dependency-name: "dotnet-sdk"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it (security updates are not delayed).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

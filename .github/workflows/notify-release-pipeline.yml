name: Notify Release Pipeline

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

jobs:
  notify:
    # Only real releases (started by hand), never pull request dry runs.
    if: github.event.workflow_run.event == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
    uses: poli0981/.github/.github/workflows/notify-release-pipeline.yml@c3e118a01d40e95b36b2c3466dc206638c11eb5a
    secrets:
      DISCORD_RELEASE_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_PIPELINE_WEBHOOK }}

name: Notify CI Failures

on:
  workflow_run:
    workflows: [CI, Security, Scorecard, SonarCloud]
    types: [completed]

permissions: {}

jobs:
  notify:
    # Failures on this repository's own pushes and schedules only; fork pull requests cannot trigger a message.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
    permissions:
      contents: read
      actions: read
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@c3e118a01d40e95b36b2c3466dc206638c11eb5a
    secrets:
      DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}

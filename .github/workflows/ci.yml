name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore HashTool.slnx

      # Warnings fail the build, including NuGet audit (NU1901-NU1904) for vulnerable packages.
      - name: Build
        run: dotnet build HashTool.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test --solution HashTool.slnx -c Release --no-build
          --results-directory TestResults
          --coverage --coverage-output-format cobertura

      - name: Coverage gate (HashTool.Core >= 80%)
        if: runner.os == 'Linux'
        run: python3 -I eng/coverage-gate.py TestResults HashTool.Core 80

      # Starts the real app headless: every page, every language, hashing and verifying a file.
      - name: Smoke test
        shell: bash
        env:
          HASHTOOL_DATA_DIR: ${{ runner.temp }}/smoke-data
        run: dotnet src/HashTool.App/bin/Release/net10.0/CheckHash.dll --smoke-test --smoke-out TestResults/smoke.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - name: Restore
        run: dotnet restore HashTool.slnx

      - name: Check formatting
        run: dotnet format HashTool.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Check translations
        run: python3 -I eng/loc.py check

  # Single required status check for branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build-test, format]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All CI jobs passed
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          FORMAT: ${{ needs.format.result }}
        run: |
          echo "build-test: $BUILD_TEST, format: $FORMAT"
          test "$BUILD_TEST" = success && test "$FORMAT" = success

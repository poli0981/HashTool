name: Release

# Builds, packages and tests every platform; publishes only when started by hand with publish=true.
# Pull requests that touch the release machinery get a full dry run (nothing is published).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without a leading v, e.g. 1.2.0 (must match Directory.Build.props to publish)"
        required: true
        type: string
      publish:
        description: "Publish the GitHub release (unchecked = dry run)"
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      # vpk and CycloneDX versions.
      - .config/dotnet-tools.json
      - build/**
      - eng/assert-release.py
      - eng/release-notes.py
      - tests/Compat/**

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1
  PACK_ID: HashTool
  # The release 1.x clients update from in the upgrade gate.
  LEGACY_VERSION: 1.1.3

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          project=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "$EVENT" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            publish="$INPUT_PUBLISH"
          else
            # Pull request dry run: a pre-release above the last release, so the upgrade gate still applies.
            version="$project-ci.$GITHUB_RUN_NUMBER"
            publish=false
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a valid version (expected 1.2.3 or 1.2.3-suffix, no leading v)"
            exit 1
          fi
          if [ "$publish" = true ]; then
            if [ "$version" != "$project" ]; then
              echo "::error::Version $version does not match Directory.Build.props ($project)"
              exit 1
            fi
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are published from main only (got $GITHUB_REF)"
              exit 1
            fi
            if gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::Release $version already exists"
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "notes=$project"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (publish: $publish)"

      - name: Release notes
        env:
          NOTES_VERSION: ${{ steps.version.outputs.notes }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PUBLISH" = true ]; then flags+=(--require-date); fi
          python3 -I eng/release-notes.py "$NOTES_VERSION" "${flags[@]}" > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: release-notes.md
          retention-days: 7

  app:
    name: app (${{ matrix.channel }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64, channel: win, exe: CheckHash.exe }
          - { os: macos-15, rid: osx-arm64, channel: osx, exe: CheckHash }
          - { os: macos-15-intel, rid: osx-x64, channel: osx-x64, exe: CheckHash }
          - { os: ubuntu-24.04, rid: linux-x64, channel: linux, exe: CheckHash }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
      CHANNEL: ${{ matrix.channel }}
      MAIN_EXE: ${{ matrix.exe }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes

      - name: Install tools
        run: |
          dotnet tool restore
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools; fi

      # Same shape as every 1.x release: self-contained single file, CheckHash(.exe) as the main executable.
      - name: Publish
        run: >
          dotnet publish src/HashTool.App/HashTool.App.csproj -c Release -r "$RID" --self-contained
          -p:PublishSingleFile=true -p:Version="$VERSION" -o "publish/$RID"

      - name: Smoke test
        env:
          HASHTOOL_DATA_DIR: ${{ runner.temp }}/smoke
        run: '"publish/$RID/$MAIN_EXE" --smoke-test --expect-version "$VERSION"'

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: >
          dotnet vpk pack -u "$PACK_ID" -v "$VERSION" -p "publish/$RID" -e "$MAIN_EXE" -c "$CHANNEL" -r "$RID"
          --icon src/HashTool.App/Assets/icon/favicon.ico --delta None --releaseNotes release-notes.md -o Releases

      # The custom Info.plist keeps the 1.x bundle identity and adds "Open With" document types.
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: |
          sed "s/@VERSION@/$VERSION/g" build/macos/Info.plist > "$RUNNER_TEMP/Info.plist"
          plutil -lint "$RUNNER_TEMP/Info.plist"
          dotnet vpk pack -u "$PACK_ID" -v "$VERSION" -p "publish/$RID" -e "$MAIN_EXE" -c "$CHANNEL" -r "$RID" \
            --packTitle "Hash Tool" --plist "$RUNNER_TEMP/Info.plist" \
            --icon src/HashTool.App/Assets/icon/icons.icns --delta None --releaseNotes release-notes.md -o Releases

      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: >
          dotnet vpk pack -u "$PACK_ID" -v "$VERSION" -p "publish/$RID" -e "$MAIN_EXE" -c "$CHANNEL" -r "$RID"
          --packTitle "Hash Tool" --icon build/linux/hashtool.png --categories Utility
          --delta None --releaseNotes release-notes.md -o Releases

      - name: Check packages
        run: |
          bundle_id=()
          if [ "$RUNNER_OS" = macOS ]; then bundle_id=(com.HashTool.HashTool); fi
          python3 -I eng/assert-release.py Releases "$CHANNEL" "$VERSION" "$MAIN_EXE" "${bundle_id[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.channel }}
          path: Releases/*
          if-no-files-found: error
          retention-days: 7

  # Updates a real Hash Tool 1.1.3 with its own Velopack 0.0.1298 library and updater, then starts the result.
  upgrade-gate:
    name: upgrade-gate (${{ matrix.channel }})
    needs: [prepare, app]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, channel: win }
          - { os: macos-15, channel: osx }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ matrix.channel }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.channel }}
          path: Releases

      - name: Install Hash Tool ${{ env.LEGACY_VERSION }} (portable)
        run: |
          set -euo pipefail
          gh release download "$LEGACY_VERSION" --repo "$GITHUB_REPOSITORY" -p "HashTool-$CHANNEL-Portable.zip" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/legacy"
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -x -k "$RUNNER_TEMP/HashTool-$CHANNEL-Portable.zip" "$RUNNER_TEMP/legacy"
            root="$RUNNER_TEMP/legacy/Hash Tool.app"
            app="$root/Contents/MacOS"
            update="$app/UpdateMac"
            exe="$app/CheckHash"
          else
            unzip -q "$RUNNER_TEMP/HashTool-$CHANNEL-Portable.zip" -d "$RUNNER_TEMP/legacy"
            root="$RUNNER_TEMP/legacy"
            app="$root/current"
            update="$root/Update.exe"
            exe="$app/CheckHash.exe"
          fi
          ls -la "$app"
          test -x "$update" -o -f "$update"
          {
            echo "LEGACY_ROOT=$root"
            echo "LEGACY_APP=$app"
            echo "LEGACY_UPDATE=$update"
            echo "LEGACY_EXE=$exe"
          } >> "$GITHUB_ENV"

      - name: Find and download the update with Velopack 0.0.1298
        run: |
          set -euo pipefail
          package=$(dotnet run --project tests/Compat/LegacyClient -c Release -- \
            "$PWD/Releases" "$CHANNEL" "$LEGACY_VERSION" "$VERSION" "$LEGACY_ROOT" "$LEGACY_APP" "$LEGACY_UPDATE" "$RUNNER_TEMP/packages")
          echo "UPDATE_PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Apply with the ${{ env.LEGACY_VERSION }} updater
        run: |
          "$LEGACY_UPDATE" --silent --verbose --log "$RUNNER_TEMP/update.log" apply --package "$UPDATE_PACKAGE" --norestart
          # The updater may finish its work in a child process; wait for the new version to appear.
          for _ in $(seq 1 60); do
            if grep -q "applied successfully" "$RUNNER_TEMP/update.log" 2> /dev/null; then break; fi
            sleep 2
          done
          tail -n 40 "$RUNNER_TEMP/update.log"

      - name: Start the updated app
        env:
          HASHTOOL_DATA_DIR: ${{ runner.temp }}/smoke
        run: '"$LEGACY_EXE" --smoke-test --expect-version "$VERSION"'

      - name: Upload updater log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-gate-log-${{ matrix.channel }}
          path: ${{ runner.temp }}/update.log
          if-no-files-found: ignore
          retention-days: 7

  cli:
    name: cli (${{ matrix.rid }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64, exe: hashtool.exe }
          - { os: macos-15, rid: osx-arm64, exe: hashtool }
          - { os: macos-15-intel, rid: osx-x64, exe: hashtool }
          # Built on the oldest supported Ubuntu so the native binary runs on older glibc.
          - { os: ubuntu-22.04, rid: linux-x64, exe: hashtool }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
      EXE: ${{ matrix.exe }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q clang zlib1g-dev

      - name: Publish (NativeAOT)
        run: |
          set -euo pipefail
          name="hashtool-$VERSION-$RID"
          dotnet publish src/HashTool.Cli/HashTool.Cli.csproj -c Release -r "$RID" -p:Version="$VERSION" -o "cli/$name"
          rm -rf "cli/$name"/*.pdb "cli/$name"/*.dbg "cli/$name"/*.dSYM
          cp LICENSE "cli/$name/"
          ls -la "cli/$name"
          echo "CLI_NAME=$name" >> "$GITHUB_ENV"

      - name: Test the binary
        run: |
          set -euo pipefail
          bin="cli/$CLI_NAME/$EXE"
          test "$("$bin" --version)" = "$VERSION"
          printf '123456789' > "$RUNNER_TEMP/check.txt"
          "$bin" hash -a crc32 "$RUNNER_TEMP/check.txt" | grep -q '^cbf43926  '
          "$bin" check "$RUNNER_TEMP/check.txt" -e 15e2b0d3c33891ebb0f1ef609ec419420c20e320ce94c65fbc8c3312448eb225

      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path 'cli/$CLI_NAME' -DestinationPath 'dist/$CLI_NAME.zip'"
          else
            tar -czf "dist/$CLI_NAME.tar.gz" -C cli "$CLI_NAME"
          fi
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [prepare, app, upgrade-gate, cli]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{release,cli}-*"
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes

      - name: SBOM and checksums
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet CycloneDX src/HashTool.App/HashTool.App.csproj -rs -F Json -o dist -fn "hashtool-app-$VERSION.cdx.json" -sn "Hash Tool" -sv "$VERSION"
          dotnet CycloneDX src/HashTool.Cli/HashTool.Cli.csproj -rs -F Json -o dist -fn "hashtool-cli-$VERSION.cdx.json" -sn "Hash Tool CLI" -sv "$VERSION"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Check the asset list
        run: |
          set -euo pipefail
          cd dist
          for f in \
            "HashTool-$VERSION-full.nupkg" HashTool-win-Setup.exe HashTool-win-Portable.zip releases.win.json assets.win.json RELEASES \
            "HashTool-$VERSION-osx-full.nupkg" HashTool-osx-Setup.pkg HashTool-osx-Portable.zip releases.osx.json assets.osx.json \
            "HashTool-$VERSION-osx-x64-full.nupkg" releases.osx-x64.json assets.osx-x64.json \
            "HashTool-$VERSION-linux-full.nupkg" releases.linux.json assets.linux.json \
            "hashtool-$VERSION-win-x64.zip" "hashtool-$VERSION-linux-x64.tar.gz" \
            "hashtool-$VERSION-osx-arm64.tar.gz" "hashtool-$VERSION-osx-x64.tar.gz" SHA256SUMS; do
            test -f "$f" || { echo "::error::Missing release asset $f"; exit 1; }
          done
          ls -la

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Draft first, verify every upload, then publish: users never see a half-uploaded release.
      - name: Create release
        run: |
          set -euo pipefail
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Hash Tool $VERSION" --notes-file release-notes.md
          gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" dist/*
          expected=$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          actual=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Uploaded assets differ from the build output"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"

  # A release published with GITHUB_TOKEN does not trigger other workflows, so announce it from here.
  announce:
    name: announce
    needs: [prepare, publish]
    permissions:
      contents: read
    uses: poli0981/.github/.github/workflows/announce-release.yml@c3e118a01d40e95b36b2c3466dc206638c11eb5a
    with:
      tag_override: ${{ needs.prepare.outputs.version }}
    secrets:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
      DISCORD_REPO_WEBHOOK: ${{ secrets.DISCORD_REPO_WEBHOOK }}
